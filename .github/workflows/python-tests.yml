name: Python tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile server
        run: python -m compileall -q server.py
      - name: Run unit tests
        run: python -m unittest discover -v
